apply plugin: 'com.android.application'

android {
    ndkVersion "21.4.7075529"
    namespace "com.mojang.minecraftpe.platforms"
    compileSdkVersion 30
    buildToolsVersion "30.0.3"
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.mojang.minecraftpe.platforms"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    // ===== Автоматически копируем .so → demo.dat в assets =====
    task copyNativeLibToAssets(type: Copy) {
        from("$buildDir/intermediates/ndkBuild/debug/obj/local/arm64-v8a/libReverseSigma.so")
        into("src/main/assets/assets/icu/")
        rename("libReverseSigma.so", "demo.dat")
    }

    afterEvaluate {
        // Копируем ПОСЛЕ сборки нативки, но ДО упаковки APK
        tasks.named("mergeDebugAssets").configure {
            dependsOn copyNativeLibToAssets
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api fileTree(dir: 'libs', include: ['*.jar'])
}
